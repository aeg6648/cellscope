[project]
name = "cellscope"
version = "0.1.0"
description = "Open-weight battery-cell research copilot routed through Otari"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cellscope = "cellscope.cli:main"

[tool.setuptools]
packages = ["cellscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
